schema: agents-context-compact/v3
purpose: "Contract for minimal context, compaction, handoff, and resume summaries."
owns: "Context budget, compact preservation, trigger guards, and runtime-only event boundaries."
trigger_when:
  include: ["manual compact request", "context pressure or long history", "resume or handoff", "subagent closeout", "pre-commit or pre-deploy summary"]
  route_signal: "Use context_compact only when compaction, resume, handoff, or a compact artifact is created, verified, collected, or normalized."
do_not_trigger_for: ["answer-only with no state claim", "ordinary scoped edit", "plain deploy", "enterprise dispatch without compact or handoff work"]
context_budget:
  read_order: ["AGENTS.md route index", "named canonical route files", "memory index when relevant", "at most three matching memory entries", "current evidence"]
  resolver_rule: "Use agents-context-evidence/v1 before broad repository reads; default to at most three files and 8192 selected bytes."
  evidence_pointer_rule: "Preserve compact file and line pointers, dependency paths, affected tests, freshness, provenance, confidence, and gaps instead of copied source blocks."
  progressive_disclosure_rule: "Open only the files named by the selected route; expand another route only when the task crosses that contract."
  stable_prefix_rule: "Keep stable instructions, tools, and examples before dynamic state so exact prefixes remain cacheable."
  tool_output_rule: "Retain conclusions and evidence references; drop repeated logs, duplicate search results, and superseded output."
  measurement_rule: "Count input tokens including tool schemas when the runtime exposes counts; otherwise record unavailable with a reason."
  detail_file_default_max: 3
summary_contract:
  required_fields: ["active_goal", "latest_user_request", "current_route", "context_evidence_ref", "validated_assumptions", "change_boundary", "changed_files", "pending_actions", "remaining_steps", "verification_state", "open_risks", "external_access", "subagents_open", "retained_facts", "dropped_details", "recovery_pointers", "resume_pointer", "next_step", "do_not_forget", "isolation"]
  freshness_rule: "latest_user_request must be concrete and supersede older requests."
  minimality_rule: "Keep only operational facts needed to continue; omit narrative, raw transcript, and raw worker chatter."
  loss_rule: "If uncertain, mark unknown and list the exact file or state to recheck."
  knowledge_footprint_rule: "Promote only reusable verified lessons; stale memory cannot drive current action and current evidence wins."
thread_state:
  source_order: ["latest user request", "active goal if present", "git/status evidence", "changed files", "verification output", "open employee/runtime evidence"]
  preserve: ["route", "context evidence reference", "validated assumptions", "change boundary", "remaining steps", "recovery pointers", "authorization scope", "external paths", "model tier decisions", "cleanup status", "blocked conditions"]
  discard: ["older superseded instructions", "raw worker chatter", "long command output", "unverified speculation"]
auto_compact:
  before: ["context pressure", "long workflow handoff", "subagent integration", "pre-commit when many files changed", "pre-deploy when target auth matters"]
  after: ["employee closeout", "verification pass or fail", "risk decision", "route switch after user redirect"]
  reject_when: ["missing latest_user_request", "missing changed_files when files changed", "unclosed subagents without risk entry", "raw transcript included", "external access omitted"]
runtime_events:
  optional_path: ".agents/runtime/compact-events.jsonl"
  git_rule: "Runtime compact events stay ignored; never stage, deploy, release, or copy."
  event_fields: ["event_id", "trigger", "thread_source", "workflow_id", "summary_path", "created_at", "context_evidence_ref", "validated_assumptions", "change_boundary", "remaining_steps", "recovery_pointers", "retained_facts", "dropped_details", "resume_pointer", "verification", "risks"]
  trigger_values: ["manual", "auto", "handoff", "subagent_closeout", "pre_commit", "pre_deploy", "route_switch"]
subagent_rule: "Closeout summaries record requested, spawned, completed, and closed counts or state no employees were spawned."
approval_rule: "Do not use compact summaries as approval; preserve the approval gate or escalation record reference."
verification:
  profile: "context_compact"
  pass_when: ["required fields present", "context evidence pointer present", "validated assumptions present", "remaining steps present", "recovery pointers present", "route-only read budget stated", "no raw transcript", "current request preserved", "retained_facts present", "dropped_details present", "resume_pointer present", "open risks explicit", "runtime events remain local"]
