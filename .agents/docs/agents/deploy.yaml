schema: agents-deploy/v2
purpose: "Deploy allowlist/blocklist."
owns: "Modes, file sets, gates."
boundary:
  requires: "authorized exact target path"
  method: "inspect target; copy/adapt allowlist"
  target_owns: ["Codex policy","env","runtime","context indexes","workflow artifacts","compact events","memory","git"]
  source_must_not_store: "no target status/context indexes/workflow artifacts/compact events/commits/remotes/deployment results/live ids"
  claim_boundary: "Clean needs target dry-run/verify."
target_layout:
  detect_first: ["AGENTS.md","docs/agents",".agents/docs/agents",".agents/skills"]
  public_profiles:
    auto: "Detect or root-layout."
    root-layout: "docs/agents."
    dot-agents-layout: ".agents/docs."
  root_docs: "docs/agents."
  dot_agents_docs: ".agents/docs."
  rule: "Preserve one layout unless migrating."
  report_name_rule: "Names: auto, root-layout, dot-agents-layout."
  mixed_route_rule: "AGENTS route cannot include both docs layouts."
  target_path_rule: "`to` precedes layout rewrite."
  path_rewrite: "For .agents/docs, rewrite refs by layout_destination_map."
  layout_destination_map:
    root_docs:
      "AGENTS.md": "AGENTS.md"
      ".gitignore append/adapt": ".gitignore append/adapt"
      ".agents/docs/agents/": ".agents/docs/agents/"
      ".agents/docs/runbooks/": ".agents/docs/runbooks/"
      ".agents/docs/templates/agents/": ".agents/docs/templates/agents/"
      "docs/*.template.md": "docs/<same basename>"
      ".agents/docs/project-memory.md": ".agents/docs/project-memory.md"
      ".agents/docs/memory/index.md": ".agents/docs/memory/index.md"
      ".agents/docs/memory/entries/README.md": ".agents/docs/memory/entries/README.md"
      ".agents/docs/project-structure.md": ".agents/docs/project-structure.md"
      ".agents/skills/": ".agents/skills/"
    dot_agents_docs:
      "AGENTS.md": "AGENTS.md"
      ".gitignore append/adapt": ".gitignore append/adapt"
      ".agents/docs/agents/": ".agents/docs/agents/"
      ".agents/docs/runbooks/": ".agents/docs/runbooks/"
      ".agents/docs/templates/agents/": ".agents/docs/templates/agents/"
      "docs/*.template.md": ".agents/docs/<same basename>"
      ".agents/docs/project-memory.md": ".agents/docs/project-memory.md"
      ".agents/docs/memory/index.md": ".agents/docs/memory/index.md"
      ".agents/docs/memory/entries/README.md": ".agents/docs/memory/entries/README.md"
      ".agents/docs/project-structure.md": ".agents/docs/project-structure.md"
      ".agents/skills/": ".agents/skills/"
  ambiguous: "If both exist, follow AGENTS.md; report other as target-owned historical state."
dirty_target:
  classify_before_write:
    deploy_scope: "Files this deployment may update."
    protected_dirty: "Unrelated app/config/secrets/runtime; untouched."
    target_historical_agents: "Agent history outside deployed_file_set."
  rule: "Do not fail or broaden cleanup; report them separately."
  deployed_file_set: "Exact written/verified files."
  validation_scope: "Validate deployed_file_set, not the whole dirty target."
  snapshot_fields: ["pre_dirty_snapshot","post_dirty_snapshot","changed_by_deploy","unexpected_changed_files"]
  dirty_snapshot_guard: "Allow deployed_file_set, env, reports, gitignore."
  unexpected_change_rule: "New/changed business files fail."
deployment_modes:
  core_bootstrap: "AGENTS, rules, skill, gitignore, runbooks."
  full_workflow: "Add memory/evidence templates."
  template_provider_mode: "Add templates for redeploy."
deployment_manifest_markers:
  core_bootstrap_foundation: ".agents/docs/agents/openai-foundations.yaml canonical-source-only"
upgrade:
  rule: "Allowlisted redeploy: dry-run, preserve target state, update deployed_file_set only."
  overwrite_gate: "Changed files need -Upgrade after dry-run."
  dry_run_plan: "Classify create/update/current/-Upgrade without writing."
  version_source: ".agents/docs/agents/version.yaml"
  target_marker: "Version is contract, not runtime state."
  no_permission_repair: "No OS permission, ACL, or .git metadata repair."
  same_repo_guard: "Deployment must not write into the provider/source repo."
  target_creation: "Missing target needs explicit non-dry run target-creation switch."
delegated_deployment:
  trigger: "Deploy-to-path request."
  worker_role: "deployment_worker"
  assignment_scope: "One target, mode, write flag, runbook."
  controller_duties: ["verify authorization","choose mode","review dry-run","integrate report"]
  worker_duties: ["inspect layout","dry-run","write deployed_file_set only","report XR/XW"]
  forbidden: ["copy runtime state","edit app code","repair OS/Git metadata","store target history"]
mode_composition:
  core_bootstrap: ["core_bootstrap"]
  full_workflow: ["core_bootstrap", "full_workflow_additions"]
  template_provider_mode: ["core_bootstrap", "full_workflow_additions", "template_provider_additions"]
deployable_by_mode:
  core_bootstrap:
    - from: "AGENTS.md"
      to: "AGENTS.md"
    - from: ".agents/docs/templates/agents/gitignore.fragment"
      to: ".gitignore append/adapt"
    - from: ".agents/docs/agents/policy.yaml"
      to: ".agents/docs/agents/policy.yaml"
    - from: ".agents/docs/agents/ai-runtime.yaml"
      to: ".agents/docs/agents/ai-runtime.yaml"
    - from: ".agents/docs/agents/org.yaml"
      to: ".agents/docs/agents/org.yaml"
    - from: ".agents/docs/agents/model-policy.yaml"
      to: ".agents/docs/agents/model-policy.yaml"
    - from: ".agents/docs/agents/dispatch.yaml"
      to: ".agents/docs/agents/dispatch.yaml"
    - from: ".agents/docs/agents/workflows.yaml"
      to: ".agents/docs/agents/workflows.yaml"
    - from: ".agents/docs/agents/workflow-artifacts.yaml"
      to: ".agents/docs/agents/workflow-artifacts.yaml"
    - from: ".agents/docs/agents/context-compact.yaml"
      to: ".agents/docs/agents/context-compact.yaml"
    - from: ".agents/docs/agents/context-intelligence.yaml"
      to: ".agents/docs/agents/context-intelligence.yaml"
    - from: ".agents/docs/agents/collaborators.yaml"
      to: ".agents/docs/agents/collaborators.yaml"
    - from: ".agents/docs/agents/core-system.yaml"
      to: ".agents/docs/agents/core-system.yaml"
    - from: ".agents/docs/agents/runtime-execution.yaml"
      to: ".agents/docs/agents/runtime-execution.yaml"
    - from: ".agents/docs/agents/provider-adapters.yaml"
      to: ".agents/docs/agents/provider-adapters.yaml"
    - from: ".agents/docs/agents/route-packs.yaml"
      to: ".agents/docs/agents/route-packs.yaml"
    - from: ".agents/docs/agents/knowledge-footprint.yaml"
      to: ".agents/docs/agents/knowledge-footprint.yaml"
    - from: ".agents/docs/agents/schemas.yaml"
      to: ".agents/docs/agents/schemas.yaml"
    - from: ".agents/docs/agents/deploy.yaml"
      to: ".agents/docs/agents/deploy.yaml"
    - from: ".agents/docs/agents/openai-foundations.yaml"
      to: ".agents/docs/agents/openai-foundations.yaml"
    - from: ".agents/docs/agents/version.yaml"
      to: ".agents/docs/agents/version.yaml"
    - from: ".agents/docs/agents/verify.yaml"
      to: ".agents/docs/agents/verify.yaml"
    - from: ".agents/skills/project-isolation-workflow/SKILL.md"
      to: ".agents/skills/project-isolation-workflow/SKILL.md"
    - from: ".agents/skills/project-isolation-workflow/agents/openai.yaml"
      to: ".agents/skills/project-isolation-workflow/agents/openai.yaml"
    - from: "scripts/agents-cleanup.ps1"
      to: "scripts/agents-cleanup.ps1"
    - from: ".agents/docs/runbooks/agents-deployment.md"
      to: ".agents/docs/runbooks/agents-deployment.md"
    - from: ".agents/docs/runbooks/agents-operator-guide.md"
      to: ".agents/docs/runbooks/agents-operator-guide.md"
    - from: ".agents/docs/runbooks/task-closeout.md"
      to: ".agents/docs/runbooks/task-closeout.md"
  full_workflow_additions:
    - from: ".agents/docs/agent-assignment.template.md"
      to: ".agents/docs/agent-assignment.template.md"
    - from: ".agents/docs/agent-event.template.md"
      to: ".agents/docs/agent-event.template.md"
    - from: ".agents/docs/agent-status.template.md"
      to: ".agents/docs/agent-status.template.md"
    - from: ".agents/docs/controller-lease.template.md"
      to: ".agents/docs/controller-lease.template.md"
    - from: ".agents/docs/hard-isolation-evidence.template.md"
      to: ".agents/docs/hard-isolation-evidence.template.md"
    - from: ".agents/docs/runtime-multi-agent-validation.template.md"
      to: ".agents/docs/runtime-multi-agent-validation.template.md"
    - from: ".agents/docs/runtime-dry-run-evidence.template.md"
      to: ".agents/docs/runtime-dry-run-evidence.template.md"
    - from: ".agents/docs/deployment-feedback.template.md"
      to: ".agents/docs/deployment-feedback.template.md"
    - from: ".agents/docs/templates/agents/project-memory.md"
      to: ".agents/docs/project-memory.md"
    - from: ".agents/docs/templates/agents/memory-index.md"
      to: ".agents/docs/memory/index.md"
    - from: ".agents/docs/memory-entry.template.md"
      to: ".agents/docs/memory-entry.template.md"
    - from: ".agents/docs/memory/entries/README.md"
      to: ".agents/docs/memory/entries/README.md"
    - from: ".agents/docs/runbooks/isolation-audit.md"
      to: ".agents/docs/runbooks/isolation-audit.md"
    - from: ".agents/docs/runbooks/multi-agent-workflow.md"
      to: ".agents/docs/runbooks/multi-agent-workflow.md"
    - from: ".agents/docs/runbooks/repository-maintenance.md"
      to: ".agents/docs/runbooks/repository-maintenance.md"
    - from: ".agents/docs/runbooks/session-handoff.md"
      to: ".agents/docs/runbooks/session-handoff.md"
    - from: ".agents/docs/runbooks/skill-authoring.md"
      to: ".agents/docs/runbooks/skill-authoring.md"
    - from: ".agents/docs/project-structure.md"
      to: ".agents/docs/project-structure.md"
    schema_bundle: "Copy schemas/README.md + schemas/*.schema.json to schemas/."
    script_bundle: "Copy scripts/README.md + scripts/*.ps1 to scripts/."
  template_provider_additions:
    recursive_template_bundle: "Copy/adapt target-specific starters under .agents/docs/templates/agents/** only for target redeploy."
do_not_deploy:
  runtime_rule: "Block .agents/runtime/**, .workflow/**, live thread ids, indexes, and practice reports; any copied runtime path is a hard failure."
  paths:
    - "docs/agent-status.md"
    - "docs/agent-events/"
    - ".agents/docs/agent-status.md"
    - ".agents/docs/agent-events/"
    - ".agents/runtime/"
    - ".agents/runtime/collaborators.jsonl"
    - ".agents/runtime/compact-events.jsonl"
    - ".agents/runtime/context-intelligence/"
    - ".agents/runtime/workflows/"
    - ".agents/runtime/executions/"
    - ".agents/runtime/knowledge/"
    - ".agents/runtime/route-packs/"
    - ".agents/runtime/tool-evidence/"
    - ".agents/runtime/deployments/"
    - ".workflow/"
    - "docs/tmp-approval-*/"
    - ".agents/docs/tmp-approval-*/"
    - "docs/hard-isolation-evidence/"
    - ".agents/docs/hard-isolation-evidence/"
    - "docs/runtime-multi-agent-validation/"
    - ".agents/docs/runtime-multi-agent-validation/"
    - ".codex/config.toml"
    - ".codex/environments/environment.toml"
    - ".codex/environments/*.toml"
    - ".codex/environments/environment.template.toml"
    - ".git/"
    - "README.md from the template-provider repository"
    - ".agents/docs/project-structure.md from the template-provider repository"
    - ".agents/docs/project-memory.md from the template-provider repository"
    - ".agents/docs/memory/index.md from the template-provider repository"
    - ".agents/docs/templates/agents/ from the template-provider repository unless template_provider_mode is selected"
  categories: ["git metadata","runtime history/indexes/artifacts/events/ids","memory/cache/evidence","generated/build/vendor"]
case_by_case:
  - "docs/decisions/: adopted only."
  - "docs/memory/entries/: target-owned."
  - "README.md: target-owned."
  - ".gitattributes: only if same EOL."
  - ".codex/*: targeted only; never wholesale."
  - ".codex/environments/*.toml: preserve; create target env outside deployed_file_set."
cross_project_runtime_resilience:
  run_id: "Deploy/verify/cleanup records unique run_id."
  resume_pointer: "Resume from ledger, summary, refs, report; not full chat."
  temp_root: "%TEMP%/codex-agent-status/<project-id>-<repo-path-hash>/<run-id>/"
  cleanup_mandatory: "Require cleanup script/rule/gate."
  cleanup_claim_rule: "Exact id; no full-delete claim without proof."
  batch_isolation: "Unique run ids; no shared lock/manifest/hash/temp."
  route_pack_determinism: "Route pack hash ignores temp/run_id."
steps:
  - "Confirm exact target path/write authorization."
  - "Inspect target state/layout before write."
  - "Create run_id and pre_dirty_snapshot before copy."
  - "Select LayoutProfile auto/root-layout/dot-agents-layout; reject mixed routes."
  - "Choose mode; default core_bootstrap."
  - "Upgrade: dry-run first, preserve target-owned state, update only deployed_file_set."
  - "Build deployed_file_set from mode/mapping."
  - "Rewrite refs for selected layout."
  - "Append/adapt gitignore.fragment; do not replace .gitignore."
  - "If no .codex/environments/*.toml, create target env outside deployed_file_set."
  - "Drop source state; adapt assumptions to target evidence."
  - "Rebuild context intelligence indexes from target Git state and content hashes; never copy provider indexes."
  - "Validate deployed_file_set; keep historical target docs separate."
  - "Verify cleanup script, workflow cleanup rule, and cleanup gate."
  - "Record post_dirty_snapshot, changed_by_deploy, unexpected_changed_files, cleanup_capability, resume pointer."
  - "Report changes, untouched files, target-owner next actions."
  - "Run handoff: AGENTS route, skill, runbooks, feedback, runtime, git status."
  - "Report exact XR/XW target paths."
hard_fail_gates:
  - "No exact target authorization."
  - "Template contains provider state."
  - "Unverified target mode/script/stack claim."
  - "Target state stored in provider repo."
  - "Provider env copied or target env overwritten."
  - "Blocklisted file copied by default."
  - "Workflow runtime or .workflow import copied by default."
  - "Compact runtime events copied by default."
  - "Context intelligence runtime indexes or practice reports copied by default."
  - "Thread ids/window runtime copied by default."
  - "OS permission, ACL, ownership, or .git repair."
  - "Deploy script writes provider/source repo."
  - "Target claim lacks inspection/verify/handoff evidence."
  - "Competing layout without migration."
  - "AGENTS.md routes to both docs/agents and .agents/docs/agents."
  - "Cleanliness claim uses whole target, not deployed_file_set."
  - "Post-deploy snapshot has unexpected business file changes."
  - "Cleanup script, workflow cleanup rule, or verify cleanup gate missing."
  - "Runtime closeout claims full deletion without proof."
validation_levels:
  repo_local_dry_run: "source/template/blocklist checks only"
  disposable_selftest: "Executable -SelfTest verifies blocklist, cleanup, rollback, layout, and target-state boundaries."
  authorized_target_dry_run: "read target and report plan"
  authorized_target_handoff_check: "read route, skill, report, runbooks, protected paths, git status"
  authorized_target_deployment_test: "write approved files, validate deployed_file_set, handoff check"
