schema: agents-version/v2
purpose: "Context intelligence, accuracy, memory, and verification-efficiency metadata for provider and target deployments."
owns: "Current workflow version, deployment contract, and upgrade expectations."
workflow:
  version: "2.9.1"
  channel: "context-intelligence"
  positioning: "Latest-only AI Agents release with TOML-aware bounded context resolution, declared-local provenance, recoverable execution state, freshness-bound memory, and validation selected by evidence and risk."
  root_principle: "Route the task, resolve the smallest authoritative context, assess impact, execute within scope, verify precisely, close with evidence, and update durable knowledge only when its trigger is satisfied."
readiness_ladder:
  P0: "Validation entry point, canonical contracts, English-only durable rules, ignored runtime and local state, and no local permission repair."
  P1: "Deployment dry-run, target layout detection, provider self-write refusal, deployed file boundary, and upgrade gate."
  P2: "Canonical single-source deployables, target-specific starters, route packs, schema contracts, and starter coverage."
  P3: "Delegated deployment worker rules, enterprise department leader dispatch, collaborator leader windows, artifact-backed workflow packets, runtime execution evidence, and lifecycle checks."
  P4: "Release audit profile, release package export, v4 runtime release evidence, context evidence, workflow artifact verification, runtime blocklists, hard-isolation claim boundaries, full verification, and size gates."
  P5: "Target-owned state preservation, target rollback by version control, provenance-backed impact evidence, bounded context budgets, freshness-bound memory, official source review, T2 practice metrics and precision-efficiency thresholds, fallback testing, and context-aware verification."
upgrade_policy:
  default: "dry-run first"
  core_contract_rule: "Upgrades must preserve AGENTS.md routing, project-local skill invocation, enterprise_dispatch, workflow_artifact, context_compact, context_intelligence, collaborator_window, foundation_creation, runtime_execution, deploy modes, ignored runtime boundaries, and target-owned state."
  foundation_creation_rule: "Upgrades must preserve openai_foundations, current official sources, progressive disclosure, schema-first outputs, one state owner, tool boundaries, context budgets, latency controls, and evaluation gates."
  breaking_change_rule: "The provider ships one current canonical implementation; remove superseded internal formats, evidence, and compatibility branches instead of maintaining dual behavior."
  overwrite_scope: "Only allowlisted deployed files may be updated."
  preserve_target_owned: ["runtime state", "workflow artifacts", ".workflow imports", "local Codex config", "memory entries", "status files", "events", "commits", "remotes", "deployment history"]
  rollback: "Use target version control or target backup; provider repo does not store target rollback state."
delegation:
  worker_role: "deployment_worker"
  enterprise_dispatch_rule: "Controller sends enterprise assignments to department leaders; leaders split internal worker tasks and return department reports."
  workflow_artifact_rule: "Artifact-backed dispatch records local packets/results under .agents/runtime/workflows or .workflow alias; controller finalizes normalized reports only."
  context_compact_rule: "Context compaction preserves only latest request, route, changes, verification, risk, employee closeout, and next-step state; stable instructions precede dynamic state and runtime events stay local."
  context_intelligence_rule: "Context intelligence resolves at most three authoritative files by default, includes explicitly declared in-repository local TOML configuration, records provenance, confidence, hashes, freshness, impact paths, tests, gaps, and verification recommendation, and expands safely on degraded evidence."
  collaborator_window_rule: "Collaborator windows are named Codex threads for department leaders only; live thread ids and close evidence stay runtime-local."
  foundation_creation_rule: "Foundation creation turns current official OpenAI guidance into progressively disclosed, schema-backed, verifiable repo-local capabilities before release."
  runtime_execution_rule: "Plans, approvals, tool evidence, results, and cleanup claims are recorded as runtime-local execution evidence."
  knowledge_footprint_rule: "Cross-window memory is index-first recall with source_commit, content_hash, checked_at, update_trigger, supersedes, boundary, freshness, and current-evidence override; stale or conflicting knowledge is never a fact source."
  large_batch_rule: "Requests for more employees than the runtime can keep active must run in waves with queued assignments, replacement rules, and final reconciliation."
  controller_rule: "Controller grants one exact target path, one selected mode, and explicit write or dry-run scope."
  worker_rule: "Worker deploys only the selected mode's deployed_file_set and reports exact read/write paths."
