schema: agents-context-intelligence/v1
purpose: "Resolve the smallest authoritative context for an AI Agents task, expose impact evidence, and expand safely when evidence is incomplete."
owns:
  - task intent and canonical route decision
  - bounded relevant-file pointers
  - dependency paths, affected tests, and verification recommendation
  - provenance, confidence, freshness, and gap reporting
does_not_own:
  - repository-wide semantic indexing
  - authorization to edit or skip verification
  - external project state
  - durable knowledge storage

task_decision:
  required:
    - route
    - intent
    - change_scope
    - risk_level
    - required_evidence
    - verification_level
  authority: .agents/docs/agents/ai-runtime.yaml
  rule: canonical routing wins over heuristic matches

resolver:
  command: ".\scripts\resolve-agent-context.ps1 -Task <text> [-ChangedPath <path[]>] [-MaxFiles 3] [-BudgetBytes 8192] [-Format Compact|Json]"
  defaults:
    max_files: 3
    budget_bytes: 8192
    output: pointer-first
  evidence_schema: agents-context-evidence/v1
  required_fields:
    - route
    - relevant_files
    - dependency_paths
    - affected_tests
    - freshness
    - provenance
    - confidence
    - gaps
    - verification_recommendation

impact_sources:
  authoritative:
    - git tracked paths and working-tree state
    - declared local in-repository changed paths, including ignored target-owned TOML configuration
    - canonical YAML and JSON contracts
    - PowerShell AST parse results
    - TOML parse results from Python tomllib or tomli, or ConvertFrom-Toml when available
    - explicit script calls and template mappings
    - test ownership and import or include references
  heuristic:
    - bounded path-reference scans
    - filename and task-token matches
  heuristic_limit: discovery only; never sufficient to modify content or skip verification

freshness:
  runtime_root: .agents/runtime/context-intelligence/
  index: .agents/runtime/context-intelligence/index.json
  key:
    - source commit
    - working-tree fingerprint
    - file SHA-256
    - inventory source
  update: incrementally reuse unchanged entries and reparse changed content
  deployable: false
  durable: false

fallback:
  triggers:
    - parsing failure or parser unavailable
    - conflicting evidence
    - unsupported changed language
    - dirty working tree
    - stale or unreadable index
    - degraded Git or index access
  action:
    - report the gap
    - expand required context
    - recommend full validation
    - preserve unresolved risk in closeout and recovery state
  forbidden:
    - silent continuation
    - invented confidence
    - validation reduction

workflow_loop:
  - classify task and canonical route
  - resolve minimal authoritative context
  - identify affected rules, scripts, tests, templates, and deployment files
  - execute within declared change scope
  - run the recommended minimum verification
  - capture evidence and unresolved risk
  - update durable knowledge only when its trigger is satisfied

validation:
  local_default: Auto
  release: Required
  checkpoint_rule: commit, push, tag, and release always run full checkpoint gates
  practice_suite: scripts/test-context-intelligence.ps1
  acceptance:
    task_accuracy: 1.0
    critical_impact_recall: 1.0
    impact_precision_min: 0.85
    context_median_reduction_min: 0.50
    tool_call_reduction_min: 0.30
    fallback_pass_rate: 1.0

boundaries:
  - CodeGraph ideas are research input only; no CodeGraph runtime or dependency is installed.
  - No SQLite, tree-sitter, watcher, or standalone MCP service is part of this contract.
  - Runtime context intelligence never enters deployment or release packages.
  - External project pilots remain outside the v2.9.1 claim boundary.
