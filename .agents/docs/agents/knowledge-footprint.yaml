schema: agents-knowledge-footprint/v3
purpose: "Recoverable runtime footprints plus fresh, evidence-linked project memory for cross-window and cross-task continuity."
storage:
  root: ".agents/runtime/knowledge/<footprint_id>.json"
  tracked: false
  deployable: false
record:
  required_fields: ["footprint_id","scope","opened_files","evidence_refs","gaps","conclusion","resume_pointer","source_commit","content_hash","checked_at","update_trigger","supersedes","boundary"]
opened_files:
  fields: ["path","reason","hash","provenance","confidence","freshness"]
retention:
  keep:
    - "facts needed to resume"
    - "decisions"
    - "validated evidence refs"
    - "known gaps"
  drop:
    - "full transcript"
    - "raw worker chatter"
    - "provider session"
    - "live thread id"
resume_pointer:
  required_fields:
    - "route_id"
    - "next_action"
    - "minimum_files_to_open"
durable_memory:
  root: "docs/memory/"
  index: ".agents/docs/memory/index.md"
  authoritative: false
  required_metadata: ["ID","Date","Title","Trigger","Keywords","Summary","Entry","Status","Confidence","Source Commit","Content Hash","Checked At","Last Verified","Next Review Due","Update Trigger","Supersedes","Boundary","Source Refs"]
  status_values: ["active","stale","retired"]
  confidence_values: ["high","medium","low"]
retrieval:
  index_first: true
  max_detail_entries: 3
  max_detail_bytes: 8192
  stop_rule: "Stop after enough current evidence exists to act; do not load unrelated memory entries."
  evidence_rule: "Verify every retrieved lesson against current repository or official-source evidence before using it."
promotion:
  allow: ["verified reusable project-specific lesson","stable decision with source refs","repeat failure prevention"]
  reject: ["secret","credential","raw transcript","runtime id","provider session","unverified speculation","temporary task state"]
  rule: "Promote only after verification; tracked memory is recall support, never an approval or policy authority."
freshness:
  default_review_days: 90
  active_rule: "Active entries must have Last Verified and a non-overdue Next Review Due date."
  stale_rule: "Stale, conflicting, superseded, or retired entries may explain history but cannot directly drive an action, modification, skipped verification, or current claim."
  conflict_rule: "When hashes, source commits, or current evidence conflict, mark the knowledge stale and resolve against current repository or official-source evidence."
rules:
  - "A runtime footprint summarizes resume evidence; it is not durable memory or a transcript."
  - "Every compaction must state retained facts, dropped details, risk, and resume pointer."
  - "Runtime footprints remain local; only verified reusable lessons may be promoted to tracked project memory."
  - "Checked-in policy remains authoritative over memory, and current evidence remains authoritative over recall."
validation:
  profile: "knowledge_footprint"
