schema: agents-verify/v2
profile_selection:
  order: ["answer/read-only","state/edit/git/deploy","policy/core/foundation/runtime/provider/route/knowledge","enterprise/artifact/compact/context/collaborator","checkpoint/release/runtime/isolation"]
  mixed_claim_rule: "Use highest-risk profile; do not upgrade unrelated facts."
  if_unclear: "State narrow claim."
file_classes:
  root_rules: ["AGENTS.md"]
  project_skill: [".agents/skills/**/SKILL.md",".agents/skills/**/agents/openai.yaml"]
  canonical_yaml: [".agents/docs/agents/*.yaml"]
  enterprise_dispatch_canonical: [".agents/docs/agents/org.yaml",".agents/docs/agents/model-policy.yaml",".agents/docs/agents/dispatch.yaml"]
  workflow_artifact_canonical: [".agents/docs/agents/workflow-artifacts.yaml"]
  context_compact_canonical: [".agents/docs/agents/context-compact.yaml"]
  context_intelligence_canonical: [".agents/docs/agents/context-intelligence.yaml"]
  collaborator_window_canonical: [".agents/docs/agents/collaborators.yaml"]
  core_system_canonical: [".agents/docs/agents/core-system.yaml"]
  foundation_creation_canonical: [".agents/docs/agents/openai-foundations.yaml"]
  runtime_execution_canonical: [".agents/docs/agents/runtime-execution.yaml"]
  provider_adapter_canonical: [".agents/docs/agents/provider-adapters.yaml"]
  route_pack_canonical: [".agents/docs/agents/route-packs.yaml"]
  knowledge_footprint_canonical: [".agents/docs/agents/knowledge-footprint.yaml"]
  runbooks: [".agents/docs/runbooks/*.md"]
  deploy_templates: [".agents/docs/templates/agents/**"]
  memory_docs: [".agents/docs/project-memory.md","docs/memory/**",".agents/docs/memory-entry.template.md"]
  runtime_local: [".agents/runtime/**",".agents/runtime/workflows/**",".workflow/**",".codex/**","docs/.agents runtime evidence dirs"]
  generated_or_cache: ["generated","cache","build","vendor"]
gate_matrix:
  changed_path_set: ["Auto uses highest-risk path","ContextMode raises, never lowers","Required fails without evidence","explicit profile may strengthen"]
  durable_prose_changed: ["English-only","placeholder"]
  exact_pair_member_changed: ["exact-pair"]
  deploy_template_changed: ["source-pollution"]
  deploy_manifest_changed: ["manifest/source/blocklist"]
  schema_changed: ["schema coverage only for broad/release/schema claim"]
  runtime_local_changed: ["ignored/local unless targeted"]
  code_or_behavior_changed: ["focused test/lint/build when available"]
  claim_upgrade: ["runtime evidence","batch reconciliation","hard-isolation evidence","release audit"]
commands:
  status_full: "git status -sb --ignored --untracked-files=all"
  status_plain: "git status -sb"
  status_scoped: "git status -sb -- <paths>"
  diff_check: "git diff --check"
  changed_manifest: "unstaged + staged changed paths"
  checkpoint_bundle: "status, diff_check, manifest, pair/prose/EOL/size, no staged runtime"
  full_audit_bundle: ".\\scripts\\validate.ps1 -Full"
  changed_validation: ".\\scripts\\validate-changes.ps1 -Profile Auto -ContextMode Auto -Explain"
  ai_runtime_compact: "ai-runtime/mirror <=4096; expand_only routes."
  enterprise_dispatch_integrity: "validate.ps1: department leader references, model tier references, escalation."
  workflow_artifact_integrity: "validate.ps1: workflow-artifacts route, approval gates, L1-6 simulations."
  context_compact_integrity: "validate.ps1: context-compact route, raw transcript, runtime event boundary."
  context_intelligence_integrity: "validate-context-intelligence.ps1 + test-context-intelligence.ps1: context_intelligence_practice; bounded files/bytes, provenance/freshness, A/B metrics, fallback states."
  collaborator_window_integrity: "validate.ps1: collaborator route/schema/mirror, leader/tier map, runtime ids, close/archive evidence."
  core_system_integrity: "validate.ps1: core contract, blocklist, version."
  foundation_creation_integrity: "validate-foundation.ps1: official docs first, structured outputs, state owner, latency controls, evaluation gate."
  runtime_execution_integrity: "validate-runtime-execution.ps1: lifecycle smoke, approvals, tool evidence, results, cleanup."
  provider_adapter_integrity: "validate.ps1: tiers, capabilities, no hard-bound workflow model id."
  route_pack_integrity: "validate-route-pack.ps1: deterministic manifest hash, compact set, cache keys."
  knowledge_footprint_integrity: "validate-knowledge.ps1: index schema, detail metadata, freshness, evidence refs, and no full transcript."
  legacy_residue_scan: "Reject retired compatibility positioning, removed external connector files, and stale helper version literals."
  release_package_export: ".\\scripts\\export-release-package.ps1 -Quiet"
  runtime_release_evidence: ".\\scripts\\capture-runtime-evidence.ps1 -OutputPath docs/evidence/releases/v2.9.0-runtime-evidence.json -Full -Practice -Quiet"
  size_gate_helper: "scripts/validate-size-gates.ps1"
  release_evidence_helper: "scripts/validate-release-evidence.ps1"
  route_pack_validation_helper: "scripts/validate-route-pack.ps1"
  runtime_execution_validation_helper: "scripts/validate-runtime-execution.ps1"
  readiness_validation_helper: "scripts/validate-readiness.ps1"
  cross_project_runtime_validation_helper: "scripts/validate-cross-project-runtime.ps1"
  change_aware_validation_helper: "scripts/validate-changes.ps1"
  knowledge_validation_helper: "scripts/validate-knowledge.ps1"
  context_intelligence_helper: "resolve-agent-context.ps1 -Task <text> -MaxFiles 3 -BudgetBytes 8192"
  score_validation_helper: "scripts/validate-score.ps1"
  runtime_helper: ".\\scripts\\agents-runtime.ps1"
  runtime_cleanup_helper: ".\\scripts\\agents-cleanup.ps1 -Action Verify"
  cleanup_mandatory_script: "scripts/agents-cleanup.ps1"
  route_pack_export: ".\\scripts\\export-route-pack.ps1"
  changed_english: 'rg -n "[\p{Han}]" <changed durable rule/template files>'
  changed_placeholders: 'rg -n "TO[D]O|\[TO[D]O\]|T[B]D|FI[X]ME" <changed durable rule/template files>'
  line_endings: "git ls-files --eol <changed files>"
  ignored_runtime: "git check-ignore -v --no-index runtime_local examples."
  deploy_steps_top_level: 'rg -n "^steps:" .agents/docs/agents/deploy.yaml .agents/docs/templates/agents/agents/deploy.yaml'
  deploy_steps_not_nested: 'rg -n "^  steps:" .agents/docs/agents/deploy.yaml .agents/docs/templates/agents/agents/deploy.yaml'
  deploy_sources_exist: "deployable_by_mode paths exist; modes/groups/script ValidateSet synced."
  deploy_manifest_unique: "deployable_by_mode paths unique; non-append paths unique."
  deploy_blocklist_required_paths: "do_not_deploy includes runtime, scratch, Codex runtime, .git paths."
  deployment_script_safety: "scripts/deploy-agents-workflow.ps1 keeps path-containment gates, no admin elevation, OS permission, .git repair."
  deployment_script_selftest: ".\\scripts\\deploy-agents-workflow.ps1 -SelfTest -Quiet"
  target_handoff_check: "Inspect AGENTS route, skill, report, runbooks, protected local paths, target git status."
  multi_agent_workflow_integrity: "validate.ps1: lifecycle, ownership, roster/ledger recovery, scoring, batch ack, delegated deployment, cleanup."
  evidence_template_schema_coverage: "validate-evidence-templates.ps1: hard-isolation, runtime multi-agent, dry-run fields."
  ci_workflow_stability: "scripts/validate.ps1 checks pinned Windows runner, fast gate, no duplicate full-audit/whitespace checks."
  template_pollution_rule: "Search deployable templates for concrete source/target literals."
  deployed_file_set_status: "git status -sb -- <deployed_file_set>"
  deployed_file_set_diff_check: "git diff --check -- <deployed_file_set>"
  powershell_rg_glob_rule: "PowerShell rg: options before --, then pattern and paths."
  deployed_file_set_literal_scan: "Search only deployed_file_set for source literals."
profiles:
  change_aware: "Auto maps risk to Fast/Policy/Full; ContextMode only raises."
  read_only_audit: "Read assigned paths; run allowed commands; report findings/isolation."
  fast_turn: "answer-only no command; edits read target, status, scoped diff, focused verify."
  policy_pack_edit: "Rules/templates: status, scoped diff, pair/prose/size gates."
  commit_tag_checkpoint: "Commit/tag/branch-push: checkpoint_bundle, EOL, no staged runtime."
  release_deploy_push_audit:
    use: "release, deploy, protected/main push, broad/no-deduction/full verification"
    do:
      baseline: ["status/diff","English/placeholders/EOL","ignored runtime"]
      deployment_integrity: ["source/unique/blocklist/template pollution"]
      deployment_script: ["containment/self-write/target-create/no-repair/self-test"]
      template_integrity: ["exact pairs","bundle coverage"]
      schema_skill_integrity: ["schemas/multi-agent/evidence templates/skill metadata"]
      size: ["size gates"]
      claim_specific: ["release appendix","runtime evidence","runtime_multi_agent/hard_isolation when claimed"]
  enterprise_dispatch: "Inspect org/model-policy/dispatch; verify leaders/workers/tiers/escalation; use L1-6; leader-only integration."
  workflow_artifact: "Inspect workflow-artifacts/schemas/verify; verify gates, packets, guardrails, collection."
  context_compact: "Inspect context-compact/schemas/verify; preserve latest request, changes, verify, risks; exclude transcript."
  context_intelligence: "Use .agents/docs/agents/context-intelligence.yaml; max three files; check provenance/freshness/gaps/fallback."
  collaborator_window: "Inspect collaborators/verify; map objective to leader; runtime evidence only; verify archive/close."
  core_system: "Inspect core-system/verify/version/deploy; verify canonical set, route pack, foundation, blocklist, version, residue."
  foundation_creation: "Inspect openai-foundations/schemas/verify; schema-first outputs, state owner, tool boundary, latency control, evaluation gate."
  runtime_execution: "Inspect runtime-execution/verify; use agents-runtime.ps1; record gates; verify cleanup evidence before claims."
  provider_adapter: "Inspect provider-adapters/model-policy/verify; bind tiers first; model ids replaceable."
  route_pack: "Inspect route-packs/ai-runtime/verify; export deterministic manifest; verify hashes and compact files."
  knowledge_footprint: "Inspect knowledge-footprint/context-compact/verify; retrieve index-first, enforce freshness, store refs, gaps, conclusion, resume pointer."
  runtime_multi_agent: "Runtime multi-agent claims require live_employee_validation; batch claims need batch_employee_validation."
  hard_isolation: "Claiming tool/external isolation requires current hard-isolation evidence; otherwise behavioral-only."
size_gates:
  unit: "bytes; 1 KiB = 1024 bytes"
  targets:
    AGENTS.md: 1848
    project_skill: 1592
    canonical_agents_yaml: 15684
    script_ps1: 129000
    validate_script_ps1_after_split: 110000
    tracked_repo_kib: 896
  tracked_rule: "Ignored/untracked files excluded; intended new files count."
evidence_tiers:
  current_release_max: "T2 current-repo practice"
  rule: "Do not claim above captured evidence tier."
  levels: ["T0 static","T1 dry-run","T2 current-repo practice","T3 external pilot","T4 enforced isolation"]
claim_scopes:
  static_policy_pack: "Relevant gates passed; no runtime/hard-isolation proof."
  runtime_multi_agent: "Only after live employee evidence; batch also needs reconciliation."
  hard_isolation: "Only after current tool/external enforcement evidence; else behavioral-only."
  deploy_clean: "Only after affected deploy.yaml source-neutral/template/blocklist checks."
  no_repo_pollution: "Only after status and ignored/local-runtime checks cover affected files."
minimum_evidence:
  static_policy_pack: ["changed files read","scoped diff reviewed","applicable gates passed"]
  branch_push: ["checkpoint gates","current branch/remote","push result"]
  deploy_clean: ["target authorization","target inspected","layout selected","deployed_file_set recorded","blocklist checks","handoff/skipped reason"]
  runtime_multi_agent: [".agents/docs/runtime-multi-agent-validation.template.md","real runtime id","assignment/report match","git status","expected/received/closed reconciliation"]
  runtime_release_evidence: ["agents-runtime-evidence/v4","source_commit + validated_content_digest + working_tree status","context_intelligence_practice durations/exits/retries","token unavailable reason","T2 current-repo boundary"]
  workflow_artifact: ["workflow state","normalized collection","approval/escalation"]
  context_compact: [".agents/docs/agents/context-compact.yaml","agents-context-compact/v3","latest_user_request","open_risks"]
  context_intelligence: [".agents/docs/agents/context-intelligence.yaml","agents-context-evidence/v1","three files/8192 bytes","safe fallback"]
  collaborator_window: ["thread capability discovered","leader mapping verified","runtime-local evidence","archive/close verified"]
  core_system: ["version aligned","canonical set verified","deploy/release checked","runtime blocklist checked","foundation route verified","residue scan passed"]
  foundation_creation: [".agents/docs/agents/openai-foundations.yaml","official docs","schema/state/tool/latency/evaluation evidence"]
  runtime_execution: ["run state verified","gated action checked","tool/result evidence collected","cleanup evidence verified"]
  provider_adapter: ["tier mapping exists","capability boundary checked","no hard-bound workflow model id"]
  route_pack: ["route id checked","file hashes recorded","deterministic manifest verified","cache key fields present"]
  knowledge_footprint: [".agents/docs/agents/knowledge-footprint.yaml","agents-knowledge-footprint/v3","not overdue","current evidence rechecked"]
  hard_isolation: ["current tool/runtime/OS/account/cloud enforcement evidence"]
no_deduction_audit:
  rule: "No-deduction needs release_deploy_push_audit proof plus applicable runtime/hard-isolation evidence."
  always: ["state/diff","external + GM/GS","source-neutral templates","deployed_file_set","scratch excluded","claim scope"]
  when_applicable: ["non-overlap ownership","ledger/roster/event evidence","cleanup has history_cleanup_evidence","hard-isolation no forbidden reads"]
coverage_gates:
  slim_policy_pack: ["no-command answer-only","compact profiles/claims","enterprise/artifact/context compact/context intelligence/collaborator","source state excluded","assignment/runtime/lifecycle/recovery/scoring/deploy/verify"]
live_employee_validation:
  required: [".agents/docs/runtime-multi-agent-validation.template.md","explicit hire/spawn","real runtime id/role/task","roster/assignment/report","git scope","history_cleanup_evidence"]
batch_employee_validation:
  required: ["expected id set created before dispatch","assignment id/compact schema","missing/duplicate/invalid-format checks","failed/running/unclosed","close + zero residue","protocol smoke success vs work success","project-local skill not GS"]
  accepted_ack_formats: ["compact JSON object preferred","exact natural-language ack only when parser and normalization are stated"]
  invalid_outcomes: ["missing id","duplicate id","wrong id","parser-breaking fields","closed claim without close evidence"]
drift_checks:
  exact_pairs: ["docs and docs/templates mirror: templates, AGENTS.md, project skill files, ai-runtime, agents yaml, runbooks"]
  template_specific_cleanliness_files: ["README","gitignore.fragment","project-memory","project-structure","memory-index"]
release_appendix:
  provider_repo_checks: ["template pairs/exceptions","empty neutral memory","schema-template coverage","skill metadata"]
  source_neutral_scan_literals: ["repo/path/usernames","repo status refs","non-placeholder memory"]
