schema: agents-ai-runtime/v1
purpose: route
load: {default: ["AGENTS.md",".agents/docs/agents/ai-runtime.yaml"], expand_only: true}
base: ".agents/docs/agents/"
codes: {gm: GM, gs: GS, xr: XR, xw: XW}
route:
  answer_only: {f: [], v: none}
  current_state: {f: [], v: named_state}
  scoped_edit: {f: ["target","verify.yaml"], v: fast_turn}
  policy_pack_edit: {f: ["target_pair","verify.yaml"], v: policy_pack_edit}
  git_checkpoint: {f: ["verify.yaml"], v: commit_tag_checkpoint}
  deploy_or_release: {f: ["deploy.yaml","verify.yaml"], v: release_deploy_push_audit}
  multi_agent: {f: ["workflows.yaml","schemas.yaml","verify.yaml"], v: runtime_multi_agent}
  enterprise_dispatch: {f: ["org.yaml","model-policy.yaml","dispatch.yaml","verify.yaml"], v: enterprise_dispatch}
  workflow_artifact: {f: ["workflow-artifacts.yaml","schemas.yaml","verify.yaml"], v: workflow_artifact}
  context_compact: {f: ["context-compact.yaml","schemas.yaml","verify.yaml"], v: context_compact}
  hard_isolation: {f: ["policy.yaml","verify.yaml"], v: hard_isolation}
rules: ["classify->route->read base/f", "canonical YAML wins", "Do not load templates/**", "Never stage/deploy/copy runtime_local"]
closeout: "Isolation: GM <used/not used> | GS <used/not used> | XR <none/paths> | XW <none/paths>"
