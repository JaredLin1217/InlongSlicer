schema: agents-ai-runtime/v1
load: {default: ["AGENTS.md",".agents/docs/agents/ai-runtime.yaml"], expand_only: true}
route:
  answer_only: {f: [], v: none}
  current_state: {f: [], v: named_state}
  scoped_edit: {f: ["target",".agents/docs/agents/verify.yaml"], v: fast_turn}
  policy_pack_edit: {f: ["target_pair",".agents/docs/agents/verify.yaml"], v: policy_pack_edit}
  git_checkpoint: {f: [".agents/docs/agents/verify.yaml"], v: commit_tag_checkpoint}
  deploy_or_release: {f: [".agents/docs/agents/deploy.yaml",".agents/docs/agents/verify.yaml"], v: release_deploy_push_audit}
  multi_agent: {f: [".agents/docs/agents/workflows.yaml",".agents/docs/agents/schemas.yaml",".agents/docs/agents/verify.yaml"], v: runtime_multi_agent}
  enterprise_dispatch: {f: [".agents/docs/agents/org.yaml",".agents/docs/agents/model-policy.yaml",".agents/docs/agents/dispatch.yaml",".agents/docs/agents/verify.yaml"], v: enterprise_dispatch}
  workflow_artifact: {f: [".agents/docs/agents/workflow-artifacts.yaml",".agents/docs/agents/schemas.yaml",".agents/docs/agents/verify.yaml"], v: workflow_artifact}
  context_compact: {f: [".agents/docs/agents/context-compact.yaml",".agents/docs/agents/schemas.yaml",".agents/docs/agents/verify.yaml"], v: context_compact}
  context_intelligence: {f: [".agents/docs/agents/context-intelligence.yaml",".agents/docs/agents/context-compact.yaml",".agents/docs/agents/schemas.yaml",".agents/docs/agents/verify.yaml"], v: context_intelligence}
  collaborator_window: {f: [".agents/docs/agents/collaborators.yaml",".agents/docs/agents/verify.yaml"], v: collaborator_window}
  core_system: {f: [".agents/docs/agents/core-system.yaml",".agents/docs/agents/verify.yaml"], v: core_system}
  runtime_execution: {f: [".agents/docs/agents/runtime-execution.yaml",".agents/docs/agents/verify.yaml"], v: runtime_execution}
  provider_adapter: {f: [".agents/docs/agents/provider-adapters.yaml",".agents/docs/agents/model-policy.yaml",".agents/docs/agents/verify.yaml"], v: provider_adapter}
  foundation_creation: {f: [".agents/docs/agents/openai-foundations.yaml",".agents/docs/agents/schemas.yaml",".agents/docs/agents/verify.yaml"], v: foundation_creation}
  route_pack: {f: [".agents/docs/agents/route-packs.yaml",".agents/docs/agents/ai-runtime.yaml"], v: route_pack}
  knowledge_footprint: {f: [".agents/docs/agents/knowledge-footprint.yaml",".agents/docs/agents/context-compact.yaml",".agents/docs/agents/verify.yaml"], v: knowledge_footprint}
  hard_isolation: {f: [".agents/docs/agents/policy.yaml",".agents/docs/agents/verify.yaml"], v: hard_isolation}
rules: ["classify->route->read f", "canonical YAML wins", "Do not load .agents/docs/templates/agents/**", "Never stage, deploy, or copy runtime_local"]
