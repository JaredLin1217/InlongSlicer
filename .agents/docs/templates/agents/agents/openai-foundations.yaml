schema: agents-openai-foundations/v2
purpose: "Official OpenAI foundation for accurate, efficient, evidence-backed AI Agents work."
owns: "Official-source freshness, structured output, state ownership, context efficiency, guardrails, evaluation, and feature creation boundaries."
principles:
  official_docs_first: "Use current official OpenAI documentation before durable OpenAI API, Codex, model, tool, or Agents SDK guidance."
  progressive_disclosure: "Load route metadata first, then only the selected canonical files or skill body; do not front-load the whole policy pack."
  structured_outputs_first: "Prefer Structured Outputs for machine-consumed objects; plain JSON mode is not a schema guarantee."
  one_state_owner: "Select one continuity owner per run; do not combine Agents SDK sessions with API-managed conversation_id or previous_response_id continuity."
  evidence_before_claim: "Treat model output as a proposal until current repository evidence, tool results, schemas, or evaluations support the claim."
  memory_is_recall: "Codex memory may improve recall, but required team policy remains in AGENTS.md or checked-in canonical docs and must be reverified."
creation_primitives:
  structured_outputs:
    use_for: ["reports","plans","validation results","route manifests","workflow packets"]
    gate: "Attach a schema, reject nonconforming output, and record repair or escalation."
  conversation_state:
    use_for: ["multi-turn creation","iterative edits","long-running workflows"]
    gate: "Name one state owner and resume pointer; never mix SDK sessions with conversation_id or previous_response_id."
  agents_sdk:
    use_for: ["handoffs","guardrails","tracing","evaluation-backed agent loops"]
    gate: "Use when handoffs, guardrails, tracing, or framework ownership improve the task; protect sensitive trace data and keep tool authority explicit."
  codex_instructions:
    use_for: ["durable repository policy","nested directory overrides","repeatable team conventions"]
    gate: "Keep root AGENTS.md compact; place specialized guidance behind routes, nested AGENTS files, or skills."
  codex_skills:
    use_for: ["repeatable repo-local workflows","specialized instructions","scripts and references"]
    gate: "Use concise trigger metadata and progressive disclosure so only selected skill bodies consume working context."
  codex_memories:
    use_for: ["cross-task recall","repeated project-specific lessons","retrieval hints"]
    gate: "Keep authoritative rules in tracked docs, exclude secrets, retrieve index-first, and verify remembered facts against current evidence."
  subagents:
    use_for: ["parallel read-heavy audits","independent exploration","summarized findings"]
    gate: "Delegate only when independent work exceeds coordination cost; avoid parallel writes and return summaries instead of raw output."
context_efficiency:
  read_budget: "Classify and search before opening files; stop reading when the selected route and current evidence prove the claim."
  compaction: "For long-running interactions, compact at an explicit threshold and retain the latest compacted state plus the new turn instead of replaying old context."
  token_counting: "Measure input tokens before optimizing when token counting is available; otherwise record unavailable and the reason."
  prompt_layout: "Keep stable instructions and tools first and volatile request data last so exact-prefix prompt caching can apply."
latency_and_cost:
  prompt_caching: "Preserve exact stable prompt and tool prefixes; place volatile content later and monitor cache-hit evidence."
  predicted_outputs: "Use only for known-text edits with compatible parameters; monitor accepted and rejected prediction tokens."
  delegation: "Default to one agent; use subagents only for independent scopes with a clear time, accuracy, or context-isolation benefit."
evaluation:
  dataset_first: "Use focused datasets, graders, and trace grading for repeatable accuracy checks."
  guardrail_rule: "Put deterministic checks at input, output, and tool boundaries when failure has meaningful impact."
  score_rule: "Every foundation feature needs pass/fail evidence, risk, and rollback notes before release."
