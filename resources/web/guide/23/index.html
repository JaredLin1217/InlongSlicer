<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=0" />
<title>引导_P21</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- INLONG One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />
<link rel="stylesheet" type="text/css" href="../22/common.css" /> <!-- INLONG use common sources for setup guide and standalone dialog -->
<link rel="stylesheet" type="text/css" href="23.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />
<script type="text/javascript" src="../../include/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>
<script type="text/javascript" src="../../include/i18n.js"></script>
<script type="text/javascript" src="../js/globalapi.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="../22/common.js"></script> <!-- INLONG use common sources for setup guide and standalone dialog -->
<script type="text/javascript" src="./23.js"></script>
</head>
<body onLoad="OnInit()">
<div id="Title">
	<div id="SystemFilamentBtn" class="TitleSelected" onClick="OnSelectMenu(1)" data-i18n="system_filaments">System Filaments</div>
	<div id="CustomFilamentBtn" class="TitleUnselected" onClick="OnSelectMenu(2)" data-i18n="custom_filaments">Custom Filaments</div>
</div>
<div id="Content" class="ZScrol">

<div id="SystemFilamentsArea">

<!-- INLONG column browser -->
<div class="cbr-browser-container">
	<div class="cbr-column">
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " tabindex="1"/>
			<span class="cbr-search-placeholder" data-i18n="printer">Printer</span>
			<div class="clear-icon"></div>
		</div>
		<div class="cbr-content thin-scroll" id="MachineList">
			<div class="CValues">
				<label><input type="checkbox" mode="all" onClick="ChooseAllMachine()"  /><span data-i18n="all">All</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " tabindex="2"/>
			<span class="cbr-search-placeholder" data-i18n="filament_type">Filament type</span>
			<div class="clear-icon"></div>
		</div>
		<div class="cbr-content thin-scroll" id="FilatypeList">
			<div class="CValues">
				<label><input type="checkbox" class="trans" onClick="ChooseAllFilament()" /><span class="trans" data-i18n="all">all</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " tabindex="3"/>
			<span class="cbr-search-placeholder" data-i18n="vendor">Vendor</span>
			<div class="clear-icon"></div>
		</div>
		<div class="cbr-content thin-scroll" id="VendorList">
			<div class="CValues">
				<label><input type="checkbox" onClick="ChooseAllVendor()" /><span data-i18n="all">All</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<div class="cbr-column-title-container">
			<div class="cbr-filter-box">
				<div class="filter-icon"></div>
				<input type="text" class="cbr-filter-bar" placeholder=" " tabindex="4"/>
				<span class="cbr-filter-placeholder" data-i18n="filter_items">Filter items</span>
				<div class="clear-icon"></div>
			</div>
			<div class="ComboBox NoLabel">
				<div class="arrow-icon"></div>
				<select id="filter-tags">
					<option value="0" disabled selected hidden></option>
					<option value="1" data-i18n="checked">Checked</option>
					<option value="2" data-i18n="unchecked">Unchecked</option>
				</select>
			</div>
			<div class="list-item-count"></div>
			<div class="cbr-filter-btns">
				<span class="cbr-filter-mode-filter" data-i18n="select_filtered">Select filtered</span>
				<span class="cbr-filter-mode-visible" data-i18n="select_visible">Select visible</span>
				<div class="ButtonStyleConfirm ButtonTypeWindow  trans" data-i18n="all" onClick="SelectAllFilament(1)">all</div>
				<div class="ButtonStyleRegular ButtonTypeWindow  trans" data-i18n="clear_all" onClick="SelectAllFilament(0)">Clear all</div>
			</div>
		</div>
		<div class="cbr-content thin-scroll" id="ItemBlockArea">
			<!-- <label class="MItem"><input type="checkbox" class="trans" onClick="SelectAllFilament()" /><span class="trans" data-i18n="all">all</span></label> -->
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>
</div>

</div>

<div id="CustomFilamentsArea">
	<div id="CFilament_Btn_Area">
		<div class="ButtonStyleConfirm ButtonTypeWindow" onClick="OnClickCustomFilamentAdd()" data-i18n="create_new">Create New</div>
	</div>
    <div id="CFilament_List" class="thin-scroll">
	</div>
</div>

</div>
<div id="AcceptArea">
	<div class="ButtonStyleConfirm ButtonTypeChoice trans" data-i18n="confirm" id="AcceptBtn"  onclick="ConfirmSelect()">Confirm</div>
	<div class="ButtonStyleRegular ButtonTypeChoice trans" data-i18n="cancel" id="PreBtn"  onclick="CancelSelect()">Cancel</div>
</div>
<div id="NoticeMask">
</div>
	<div id="NoticeBody">
	<div id="NoticeBar" data-i18n="error">Error</div>
	<div id="NoticeContent">
	<div id="NoticeText" data-i18n="filament_required">At least one filament must be selected.</div>
	<div id="NoticeText" data-i18n="use_default_filament">Do you want to use the default filament?</div>
	<div id="NoticeBtns">
		<div class="ButtonStyleConfirm ButtonTypeChoice" onClick="ChooseDefaultFilament()" data-i18n="yes">Yes</div>
		<div class="ButtonStyleRegular ButtonTypeChoice" onClick="ShowNotice(0)" data-i18n="no">No</div>
	</div>
	</div>
	</div>

</body>
<script>
	document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.keyCode == 27)
			ClosePage();

		//if (window.event) {
		//	try { e.keyCode = 0; } catch (e) { }
		//	e.returnValue = false;
		//}
	};
    window.addEventListener('wheel', function (event) {
        if (event.ctrlKey === true || event.metaKey) {
            event.preventDefault();
        }
    }, { passive: false });

	initInputEvents();
</script>
</html>
