name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an InlongSlicer issue.

        Please keep reports focused on downstream InlongSlicer fixes,
        compatibility work, or secondary development based on OrcaSlicer.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this problem?
      description: Please search existing issues before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: InlongSlicer Version
      description: Which version or commit are you running?
      placeholder: e.g. 2.5.0 or commit SHA
    validations:
      required: true
  - type: input
    id: working_version
    attributes:
      label: Regression compared to a previous version
      description: Did it work in a previous version?
      placeholder: e.g. 2.3.2
    validations:
      required: false
  - type: dropdown
    id: os_type
    attributes:
      label: Operating System
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: reproduce_steps
    attributes:
      label: How to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Project file, logs, or screenshots
      description: Attach a small reproducible project, logs, or screenshots when possible.
    validations:
      required: false
