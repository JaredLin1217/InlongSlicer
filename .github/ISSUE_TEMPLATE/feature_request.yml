name: Feature Request / Enhancement
description: Suggest an InlongSlicer improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests focused on downstream InlongSlicer fixes,
        compatibility work, or secondary development based on OrcaSlicer.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this request?
      description: Please search existing issues before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested change.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream relationship
      description: Note whether this exists in OrcaSlicer or is specific to InlongSlicer.
    validations:
      required: false
